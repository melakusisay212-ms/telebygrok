name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SM=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          yes | "$SM" "platforms;android-34" "build-tools;34.0.0" "platform-tools" >/dev/null 2>&1 || true
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Prepare assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/debug/*.apk release-assets/ || true
          cp app/build/outputs/apk/release/*.apk release-assets/ || true
          ls -la release-assets/

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
